<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>COP31 Caretta Simülasyon Motoru</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #e0e0e0;
    }
    #viewDiv {
      width: 100%;
      height: 100%;
      position: absolute;
    }
    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 99;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .control-panel h2 {
      font-size: 15px;
      margin-top: 0;
      color: #4CAF50;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slider-group {
      margin-bottom: 15px;
    }
    .slider-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #b0b0b0;
    }
    .slider-group input {
      width: 100%;
      accent-color: #4CAF50;
      cursor: pointer;
    }
    .stats-box {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .stats-box span {
      font-weight: bold;
      color: #FF5722;
    }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

  <div class="control-panel">
    <h2>COP31 Simülasyon Laboratuvarı</h2>
    
    <div class="slider-group">
      <label>Kıyı Yapılaşma Kısıtı (Rehex): <span id="rehexVal">0</span>%</label>
      <input type="range" id="rehexSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="slider-group">
      <label>Işık Kirliliği Azaltma Oranı: <span id="lightVal">0</span>%</label>
      <input type="range" id="lightSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="stats-box">
      <div>Simüle Edilen Risk Durumu: <span id="statusText" style="color:#4CAF50;">Aktif (Normal)</span></div>
    </div>
  </div>

  <div id="viewDiv"></div>

  <script>
    require([
      "esri/WebScene",
      "esri/views/SceneView",
      "esri/layers/FeatureLayer"
    ], function(WebScene, SceneView, FeatureLayer) {

      const scene = new WebScene({
        portalItem: {
          id: "c624627b97ab408e8becc96792b74d4d"
        }
      });

      const view = new SceneView({
        container: "viewDiv",
        map: scene
      });

      const rehexSlider = document.getElementById("rehexSlider");
      const lightSlider = document.getElementById("lightSlider");
      const rehexVal = document.getElementById("rehexVal");
      const lightVal = document.getElementById("lightVal");
      const statusText = document.getElementById("statusText");

      // Sahne yüklendiğinde ana risk katmanını yakalayalım
     view.when(() => {
  console.log("✅ View yüklendi");
  scene.when(() => {
    console.log("✅ Scene yüklendi. Katmanlar:", scene.layers.items.map(l => ({ title: l.title, type: l.type })));

    const layer = scene.layers.find(l => l.type === "feature");

    if (!layer) {
      console.error("❌ 'feature' tipinde katman bulunamadı! Yukarıdaki listeye bakıp gerçek type değerini kontrol edin.");
      return;
    }

    console.log("✅ Katman bulundu:", layer.title);

    // Gerçek alan adlarını doğrulamak için:
    layer.load().then(() => {
      console.log("📋 Gerçek alan adları:", layer.fields.map(f => f.name));
    });

    function updateLayerSimulation() {
      const rVal = parseInt(rehexSlider.value);
      const lVal = parseInt(lightSlider.value);
      console.log("🎚️ Slider tetiklendi:", rVal, lVal);

      rehexVal.innerText = rVal;
      lightVal.innerText = lVal;

      const rFactor = 1 - (rVal / 100);
      const lFactor = 1 - (lVal / 100);

      layer.renderer = {
        type: "simple",
        symbol: {
          type: "polygon-3d",
          symbolLayers: [{
            type: "extrude",
            // ⚠️ Alan adlarını 📋 loguna göre burada düzeltin
            size: `($feature.Kiyi_Baski_Endeksi_v2 * ${rFactor} * 15) + ($feature.Kiyi_Baski_Endeksi_v2 * ${lFactor} * 10)`,
            material: { color: rVal > 50 ? [76, 175, 80, 0.8] : [244, 67, 54, 0.8] },
            edges: { type: "solid", color: [50, 50, 50, 0.5], size: 1 }
          }]
        }
      };

      statusText.innerText = (rVal > 50 || lVal > 50) ? "Optimum Koruma Sağlandı" : "Yüksek Tehdit Altında";
      statusText.style.color = (rVal > 50 || lVal > 50) ? "#4CAF50" : "#FF5722";
    }

    rehexSlider.addEventListener("input", updateLayerSimulation);
    lightSlider.addEventListener("input", updateLayerSimulation);
    updateLayerSimulation(); // sayfa açılır açılmaz bir kere çalıştır, ilk durumu görmek için
  });
});

              if(rVal > 50 || lVal > 50) {
                statusText.innerText = "Optimum Koruma Sağlandı";
                statusText.style.color = "#4CAF50";
              } else {
                statusText.innerText = "Yüksek Tehdit Altında";
                statusText.style.color = "#FF5722";
              }
            }

            rehexSlider.addEventListener("input", updateLayerSimulation);
            lightSlider.addEventListener("input", updateLayerSimulation);
          }
        });
      });

    });
  </script>
</body>
</html>
