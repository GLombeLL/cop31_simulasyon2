<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>COP31 Caretta Simülasyon Motoru</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #e0e0e0;
      overflow: hidden;
    }
    #viewDiv {
      width: 100%;
      height: 100%;
      position: absolute;
    }
    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 99;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .control-panel h2 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 15px;
      color: #4CAF50;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slider-group {
      margin-bottom: 15px;
    }
    .slider-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #b0b0b0;
    }
    .slider-group input, .slider-group select {
      width: 100%;
      cursor: pointer;
      padding: 8px;
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .slider-group select:hover {
      border-color: #4CAF50;
    }
    .stats-box {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .impact-metrics {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      border-left: 3px solid #ef5350;
      transition: all 0.3s ease;
    }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

  <div class="control-panel">
    <h2>COP31 Simülasyon Laboratuvarı</h2>
    
    <!-- Tekilleştirilmiş Plaj Filtreleme Menüsü -->
    <div class="slider-group">
      <label>Hedef Plaj / Bölge Seçimi:</label>
      <select id="beachSelect">
        <option value="all">🌍 Tüm Plajlar (Genel Görünüm)</option>
      </select>
    </div>

    <div class="slider-group">
      <label>Kıyı Yapılaşma Kısıtı (Rehex): <span id="rehexVal">0</span>%</label>
      <input type="range" id="rehexSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="slider-group">
      <label>Işık Kirliliği Azaltma: <span id="lightVal">0</span>%</label>
      <input type="range" id="lightSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="stats-box">
      <div>Durum: <span id="statusText" style="color: #ef5350;">Kritik Tehdit Altında</span></div>
      <div class="impact-metrics" id="impactText">
        🐢 Tahmini Kurtarılan Yavru: <b>~120</b> (Düşük Başarı)
      </div>
    </div>
  </div>

  <div id="viewDiv"></div>

  <script>
    require([
      "esri/WebScene",
      "esri/views/SceneView",
      "esri/geometry/geometryEngine"
    ], function(WebScene, SceneView, geometryEngine) {

      const scene = new WebScene({
        portalItem: {
          id: "c624627b97ab408e8becc96792b74d4d"
        }
      });

      const view = new SceneView({
        container: "viewDiv",
        map: scene
      });

      const rehexSlider = document.getElementById("rehexSlider");
      const lightSlider = document.getElementById("lightSlider");
      const rehexValDisplay = document.getElementById("rehexVal");
      const lightValDisplay = document.getElementById("lightVal");
      const statusText = document.getElementById("statusText");
      const impactText = document.getElementById("impactText");
      const beachSelect = document.getElementById("beachSelect");

      function getDynamicColor(val) {
        if (val < 35) return "#ef5350"; 
        if (val < 75) return "#ffa726"; 
        return "#66bb6a";              
      }

      view.when(() => {
        scene.when(() => {
          let targetLayer = null;
          scene.allLayers.forEach((layer) => {
            if (layer.type === "feature") {
              targetLayer = layer;
            }
          });

          if (targetLayer) {
            targetLayer.load().then(() => {
              // 1. TEKİLLEŞTİRME (Set kullanarak menüdeki mükerrer kayıtları engelliyoruz)
              const query = targetLayer.createQuery();
              query.where = "1=1";
              query.outFields = ["Plaj_ID", "Plaj_Adi"];
              query.returnDistinctValues = true;
              query.orderByFields = ["Plaj_Adi"];

              targetLayer.queryFeatures(query).then((response) => {
                const uniqueBeachNames = new Set();
                response.features.forEach((feature) => {
                  const pAdi = feature.attributes.Plaj_Adi;
                  if (pAdi && !uniqueBeachNames.has(pAdi)) {
                    uniqueBeachNames.add(pAdi);
                    const option = document.createElement("option");
                    option.value = pAdi;
                    option.textContent = pAdi;
                    beachSelect.appendChild(option);
                  }
                });
              });

              // 2. YAKIN VE MERKEZLENDİRİLMİŞ ZOOM (Denizi ortada bırakmayan akıllı kamera)
              beachSelect.addEventListener("change", (e) => {
                const selectedBeach = e.target.value;

                if (selectedBeach === "all") {
                  targetLayer.definitionExpression = null;
                  targetLayer.queryExtent().then((result) => {
                    if (result.extent) {
                      view.goTo({ target: result.extent, zoom: view.zoom - 1 }, { duration: 1500, easing: "in-out-cubic" });
                    }
                  });
                } else {
                  targetLayer.definitionExpression = `Plaj_Adi = '${selectedBeach}'`;

                  targetLayer.queryFeatures({
                    where: `Plaj_Adi = '${selectedBeach}'`,
                    returnGeometry: true
                  }).then((result) => {
                    if (result.features.length > 0) {
                      const geometries = result.features.map(f => f.geometry);
                      const unionGeometry = geometryEngine.union(geometries);
                      const centerPoint = unionGeometry ? unionGeometry.centroid : result.features[0].geometry.centroid;

                      view.goTo({
                        target: centerPoint,
                        scale: 2500, // Katmanın dibine giren yakın mesafe
                        tilt: 70     // Detayları net gösteren 3D açı
                      }, {
                        duration: 1800,
                        easing: "in-out-cubic"
                      });
                    }
                  });
                }
              });

              function updateLayerSimulation() {
                const rVal = parseInt(rehexSlider.value);
                const lVal = parseInt(lightSlider.value);

                rehexValDisplay.innerText = rVal;
                lightValDisplay.innerText = lVal;

                rehexSlider.style.accentColor = getDynamicColor(rVal);
                lightSlider.style.accentColor = getDynamicColor(lVal);

                const avgProtection = (rVal + lVal) / 2;
                const savedHatchlings = Math.round(120 + (avgProtection * 14.5));

                let statusHTML = "";
                let statusColor = "#ef5350";

                if (rVal === 0 && lVal === 0) {
                  statusHTML = "⚠️ <b>Kritik Tehdit:</b> Yuvalama alanları baskı altında.";
                  statusColor = "#ef5350";
                } else if (avgProtection <= 30) {
                  statusHTML = "📉 <b>Düşük Koruma:</b> Habitat kaybı sürüyor.";
                  statusColor = "#ffa726";
                } else if (avgProtection <= 70) {
                  statusHTML = "⚖️ <b>Dengeli Senaryo:</b> Kısmi iyileşme gözleniyor.";
                  statusColor = "#ffee58";
                } else if (avgProtection < 95) {
                  statusHTML = "🌿 <b>Yüksek Koruma:</b> Yuvalama başarı oranı artıyor.";
                  statusColor = "#9ccc65";
                } else {
                  statusHTML = "🌟 <b>İdeal Ekosistem:</b> COP31 Hedeflerine Tam Uyum!";
                  statusColor = "#66bb6a";
                }

                statusText.innerHTML = statusHTML;
                statusText.style.color = statusColor;
                impactText.innerHTML = `🐢 Tahmini Kurtarılan Yavru: <b>~${savedHatchlings}</b> (Verimlilik: %${Math.round(avgProtection)})`;
                impactText.style.borderLeftColor = statusColor;

                // 3. SAHİL POLİGONLARI İÇİN KIRMIZIDAN YEŞİLE DÖNÜŞEN RENDERER & DÜZGÜN BOYUT
                // Koruma arttıkça renk Kırmızı (244,67,54) -> Sarı/Turuncu -> Yeşil (76,175,80) evrilir.
                let red = Math.round(244 - (avgProtection / 100) * (244 - 76));
                let green = Math.round(67 + (avgProtection / 100) * (175 - 67));
                let blue = Math.round(54 + (avgProtection / 100) * (80 - 54));
                const dynamicPolygonColor = [red, green, blue, 0.85];

                // Boyutun aşırı küçülmesini engellemek için güvenli ve dolgun ölçek faktörü
                const scaleFactor = 0.85 + (avgProtection / 100) * 0.15;

                targetLayer.renderer = {
                  type: "simple",
                  symbol: {
                    type: "polygon-3d",
                    symbolLayers: [{
                      type: "extrude",
                      size: `$feature.Risk_Skoru * ${scaleFactor}`,
                      material: { color: dynamicPolygonColor },
                      edges: {
                        type: "solid",
                        color: [30, 30, 30, 0.4],
                        size: 1
                      }
                    }]
                  }
                };
              }

              updateLayerSimulation();

              rehexSlider.addEventListener("input", updateLayerSimulation);
              lightSlider.addEventListener("input", updateLayerSimulation);
            });
          }
        });
      });

    });
  </script>
</body>
</html>
