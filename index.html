<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>COP31 Caretta Simülasyon Motoru</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #e0e0e0;
      overflow: hidden;
    }
    #viewDiv {
      width: 100%;
      height: 100%;
      position: absolute;
    }
    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 99;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .control-panel h2 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 15px;
      color: #4CAF50;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .slider-group {
      margin-bottom: 15px;
    }
    .slider-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #b0b0b0;
    }
    .slider-group input {
      width: 100%;
      cursor: pointer;
      transition: accent-color 0.3s ease;
    }
    .stats-box {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .impact-metrics {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      border-left: 3px solid #4CAF50;
      transition: border-color 0.3s ease;
    }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/4.28/"></script>
</head>
<body>

  <div class="control-panel">
    <h2>COP31 Simülasyon Laboratuvarı</h2>
    
    <div class="slider-group">
      <label>Kıyı Yapılaşma Kısıtı (Rehex): <span id="rehexVal">0</span>%</label>
      <input type="range" id="rehexSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="slider-group">
      <label>Işık Kirliliği Azaltma: <span id="lightVal">0</span>%</label>
      <input type="range" id="lightSlider" min="0" max="100" value="0" step="5">
    </div>

    <div class="stats-box">
      <div>Durum: <span id="statusText">Simülasyon Aktif</span></div>
      <div class="impact-metrics" id="impactText">
        🐢 Tahmini Kurtarılan Yavru: <b>~120</b> (Baz Seviye)
      </div>
    </div>
  </div>

  <div id="viewDiv"></div>

  <script>
    require([
      "esri/WebScene",
      "esri/views/SceneView"
    ], function(WebScene, SceneView) {

      const scene = new WebScene({
        portalItem: {
          id: "c624627b97ab408e8becc96792b74d4d"
        }
      });

      const view = new SceneView({
        container: "viewDiv",
        map: scene
      });

      const rehexSlider = document.getElementById("rehexSlider");
      const lightSlider = document.getElementById("lightSlider");
      const rehexValDisplay = document.getElementById("rehexVal");
      const lightValDisplay = document.getElementById("lightVal");
      const statusText = document.getElementById("statusText");
      const impactText = document.getElementById("impactText");

      // Değere göre Kırmızı -> Sarı -> Yeşil renk üreten yardımcı fonksiyon
      function getDynamicColor(val) {
        if (val < 35) return "#F44336"; // Kırmızı (Riskli)
        if (val < 75) return "#FF9800"; // Turuncu/Sarı (Dengeli)
        return "#4CAF50";              // Yeşil (İdeal)
      }

      view.when(() => {
        scene.when(() => {
          let targetLayer = null;
          scene.allLayers.forEach((layer) => {
            if (layer.type === "feature") {
              targetLayer = layer;
            }
          });

          if (targetLayer) {
            function updateLayerSimulation() {
              const rVal = parseInt(rehexSlider.value);
              const lVal = parseInt(lightSlider.value);

              rehexValDisplay.innerText = rVal;
              lightValDisplay.innerText = lVal;

              // Slider renklerini değere göre dinamik güncelle
              rehexSlider.style.accentColor = getDynamicColor(rVal);
              lightSlider.style.accentColor = getDynamicColor(lVal);

              const rFactor = 1 - (rVal / 100);
              const lFactor = 1 - (lVal / 100);

              const savedHatchlings = Math.round(120 + ((rVal * 15) + (lVal * 12)));
              const efficiencyRate = Math.round((rVal + lVal) / 2);

              let statusHTML = "";
              let statusColor = "#4CAF50";

              if (rVal === 0 && lVal === 0) {
                statusHTML = "⚠️ <b>Kritik Tehdit:</b> Yuvalama baskı altında.";
                statusColor = "#F44336";
              } else if (rVal <= 30 && lVal <= 30) {
                statusHTML = "📉 <b>Düşük Koruma:</b> Kayıplar yüksek.";
                statusColor = "#FF9800";
              } else if (rVal <= 60 && lVal <= 60) {
                statusHTML = "⚖️ <b>Dengeli Senaryo:</b> Kısmi iyileşme.";
                statusColor = "#FFEB3B";
              } else if (rVal < 90 || lVal < 90) {
                statusHTML = "🌿 <b>Yüksek Koruma:</b> Başarı artıyor.";
                statusColor = "#8BC34A";
              } else {
                statusHTML = "🌟 <b>İdeal Ekosistem:</b> COP31 Hedefine Uyum!";
                statusColor = "#4CAF50";
              }

              statusText.innerHTML = statusHTML;
              statusText.style.color = statusColor;
              impactText.innerHTML = `🐢 Tahmini Kurtarılan Yavru: <b>~${savedHatchlings}</b> (Verimlilik: %${efficiencyRate})`;
              impactText.style.borderLeftColor = statusColor;

              targetLayer.renderer = {
                type: "simple",
                symbol: {
                  type: "polygon-3d",
                  symbolLayers: [{
                    type: "extrude",
                    size: (15 * rFactor) + (10 * lFactor),
                    material: { 
                      color: rVal > 50 || lVal > 50 ? [76, 175, 80, 0.85] : [244, 67, 54, 0.85] 
                    },
                    edges: {
                      type: "solid",
                      color: [30, 30, 30, 0.4],
                      size: 1
                    }
                  }]
                }
              };
            }

            rehexSlider.addEventListener("input", updateLayerSimulation);
            lightSlider.addEventListener("input", updateLayerSimulation);
          }
        });
      });

    });
  </script>
</body>
</html>
